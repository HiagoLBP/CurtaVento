$kind: http-request
name: Login (Admin)
method: POST
url: '{{base_url}}/api/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "senha": "{{senha}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Login bem-sucedido", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.environment.set("access_token", json.token);
          console.log("Token salvo em access_token");
      }
