spring.application.name=curta-vento
server.port=${PORT:8080}

# 1. Conexão com o MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/curtavento?serverTimezone=UTC&rewriteBatchedStatements=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 3. Habilitar o Flyway
spring.flyway.enabled=true

# 4. Segredo JWT (chave estável para assinar os tokens)
jwt.secret=${JWT_SECRET:curtavento-tcc-chave-secreta-muito-longa-e-segura-2026-api}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# 5. Microsserviço Preditivo Python (FastAPI + PyTorch Time2Vec)
curtavento.ml.url=${CURTAVENTO_ML_URL:http://localhost:8001}
