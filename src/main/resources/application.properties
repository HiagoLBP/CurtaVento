spring.application.name=curta-vento
server.port=${PORT:8080}

# 1. Conexão com o MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/curtavento?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Habilitar o Flyway
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true

# 4. Segredo JWT (chave estável para assinar os tokens)
jwt.secret=${JWT_SECRET:curtavento-tcc-chave-secreta-muito-longa-e-segura-2026-api}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
