spring.application.name=curta-vento

# 1. Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/curtavento?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Habilitar o Flyway
spring.flyway.enabled=true

# 4. Segredo JWT (chave estável para assinar os tokens)
jwt.secret=curtavento-tcc-chave-secreta-muito-longa-e-segura-2026-api