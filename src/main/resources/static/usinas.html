<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CurtaVento — Usinas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #F4F5F7; --bg-sidebar: #1E2329; --bg-surface: #FFFFFF;
      --border: #E4E5E7; --border-light: #F0F1F3;
      --text-main: #1A1D21; --text-muted: #6B7280; --text-faint: #9CA3AF;
      --text-sidebar: #9CA3AF;
      --brand: #2563EB; --brand-soft: #DBEAFE;
      --ok: #10B981; --warn: #F59E0B; --high: #EF4444; --crit: #991B1B;
      --font: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --radius: 8px;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg-body); color:var(--text-main); font-family:var(--font); line-height:1.5; display:flex; height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased; }

    /* Sidebar */
    .sidebar { width:260px; background:var(--bg-sidebar); color:var(--text-sidebar); display:flex; flex-direction:column; flex-shrink:0; }
    .sidebar-header { padding:24px 20px; font-size:18px; font-weight:700; color:#FFF; border-bottom:1px solid rgba(255,255,255,0.05); }
    .nav-list { display:flex; flex-direction:column; padding:16px 12px; gap:4px; }
    .nav-item { padding:10px 16px; border-radius:6px; color:var(--text-sidebar); text-decoration:none; font-size:14px; font-weight:500; display:flex; align-items:center; gap:12px; transition:all .2s; }
    .nav-item:hover { background:rgba(255,255,255,0.05); color:#FFF; }
    .nav-item.active { background:var(--brand); color:#FFF; }

    /* Layout */
    .main-wrapper { flex:1; display:flex; flex-direction:column; overflow-y:auto; }
    header { display:flex; align-items:center; justify-content:space-between; padding:20px 32px; background:var(--bg-surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
    .header-left h1 { margin:0 0 2px 0; font-size:20px; font-weight:600; }
    .header-left span { font-size:13px; color:var(--text-muted); }
    main { padding:32px; max-width:1280px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:24px; }
    footer { padding:24px 32px; font-size:12px; color:var(--text-faint); display:flex; justify-content:space-between; border-top:1px solid var(--border); background:var(--bg-surface); }

    /* Usinas Grid */
    .usinas-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(350px, 1fr)); gap:24px; }
    .usina-card { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:24px; display:flex; flex-direction:column; gap:16px; transition: transform 0.2s; }
    .usina-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    
    .u-header h3 { margin:0 0 4px 0; font-size:16px; font-weight:600; }
    .u-header p { margin:0; font-size:13px; color:var(--text-muted); }
    
    .u-details { display:flex; flex-direction:column; gap:8px; font-size:13px; color:var(--text-muted); border-bottom:1px solid var(--border-light); padding-bottom:16px; }
    .u-row { display:flex; justify-content:space-between; }
    .u-row strong { color:var(--text-main); font-weight:500; }
    
    .u-stats { display:flex; flex-direction:column; gap:12px; padding-top:4px; font-size:13px; color:var(--text-muted); }
    .u-stat-row { display:flex; justify-content:space-between; align-items:center; }
    
    .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
    .val-crit { color:var(--crit); font-weight:600; }
  </style>
<style>#error-banner { display:none; background:var(--high); color:#fff; padding:12px; text-align:center; position:fixed; top:0; width:100%; z-index:9999; font-weight:600; }</style>
</head>
<body>
<div id="error-banner">Falha na conexão com o servidor. Alguns dados podem estar desatualizados.</div>

<aside class="sidebar">
  <div class="sidebar-header">CURTAVENTO</div>
  <nav class="nav-list">
    <a href="index.html" class="nav-item">▣ Visão Geral</a>
    <a href="usinas.html" class="nav-item active">◫ Usinas</a>
    <a href="cortes.html" class="nav-item">◈ Cortes ONS</a>
    <a href="clima.html" class="nav-item">☁ Clima</a>
    <a href="#" class="nav-item" onclick="alert('Em desenvolvimento')">⚠ Risco</a>
    <a href="vaf.html" class="nav-item">$ Impacto VAF</a>
  </nav>
</aside>

<div class="main-wrapper">
  <header>
    
    <div class="header-left">
      <h1>Gestão de Usinas</h1>
      <span>Cadastro e Status dos Ativos</span>
    </div>
    <div class="header-controls" style="display:flex; gap:16px;">
        <input type="text" id="search-usina" placeholder="Buscar usina..." onkeyup="filtrarPaginar()" style="padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-family:var(--font);">
        <select id="ano-selector" class="year-select" onchange="init()" style="padding:8px 12px; border-radius:6px; border:1px solid var(--border);">
          <option value="2026">2026 ▼</option>
          <option value="2023">2023 ▼</option>
        </select>
    </div>

  </header>
  
  <main>
    
    <div class="usinas-grid" id="usinas-grid">
      <!-- Injetado via JS -->
    </div>
    <div id="pagination-controls" style="display:flex; justify-content:center; align-items:center; gap:16px; margin-top:32px;">
      <button onclick="mudarPagina(-1)" id="btn-prev" style="padding:8px 16px; background:var(--bg-surface); border:1px solid var(--border); border-radius:6px; cursor:pointer;">Anterior</button>
      <span id="page-info" style="font-size:14px; font-weight:500;">Página 1</span>
      <button onclick="mudarPagina(1)" id="btn-next" style="padding:8px 16px; background:var(--brand); color:white; border:none; border-radius:6px; cursor:pointer;">Próxima</button>
    </div>

  </main>

  <footer>
    <span>CurtaVento — protótipo de estudo, IF Baiano Campus Guanambi</span>
    <span>Fontes: INMET • ONS • Sefaz-BA</span>
  </footer>
</div>

<script>
  const API_BASE = '';

  const RISK_COLOR = {
    'BAIXO': 'var(--ok)',
    'MEDIO': 'var(--warn)',
    'ALTO': 'var(--high)',
    'CRITICO': 'var(--crit)'
  };

  async function fetchWithAuth(url, options = {}) {
    const token = localStorage.getItem('jwt_token');
    
    // Se não tiver token e não for a tela de login, redireciona
    if (!token && !window.location.href.includes('login.html') && !window.location.href.includes('cadastro.html')) {
      window.location.href = '/login.html';
      return null;
    }

    const headers = options.headers || {};
    if (token) {
      headers['Authorization'] = `Bearer ${token}`;
    }
    options.headers = headers;

    const res = await fetch(url, options);

    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('jwt_token');
      window.location.href = '/login.html';
      return null;
    }

    if (!res.ok) {
      const banner = document.getElementById('error-banner');
      if(banner) banner.style.display = 'block';
      throw new Error('Erro na API');
    }
    return await res.json();
  }

  
  let todasUsinas = [];
  let paginaAtual = 1;
  const ITENS_POR_PAGINA = 12;

  function renderGrid(lista) {
    const grid = document.getElementById('usinas-grid');
    grid.innerHTML = '';
    
    lista.forEach(u => {
        
        
        let omHtml = '<strong style="color:var(--text-muted)">N/D</strong>';
        if (u.janelaManutencao === 'LIBERADO') {
            omHtml = '<strong style="color:var(--ok)">LIBERADO ✅</strong>';
        } else if (u.janelaManutencao === 'ALERTA') {
            omHtml = '<strong style="color:var(--warn)">ALERTA ⚠️</strong>';
        } else if (u.janelaManutencao === 'BLOQUEADO') {
            omHtml = '<strong style="color:var(--high)">BLOQUEADO ❌</strong>';
        }
        const color = RISK_COLOR[u.risco] || 'var(--text-muted)';
        
        let dataStr = 'N/I';
        if(u.dataInicio) {
          const parts = u.dataInicio.split('-');
          if(parts.length === 3) dataStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        
        const perdaFinanceira = u.prejuizoFinanceiro || 0;
        const perdaText = perdaFinanceira > 1000000 
            ? `R$ ${(perdaFinanceira/1000000).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})} milhões`
            : `R$ ${(perdaFinanceira/1000).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})} mil`;

        grid.innerHTML += `
          <div class="usina-card">
            <div class="u-header">
              <h3>${u.nome}</h3>
              <p>${u.operador || 'N/I'}</p>
            </div>
            
            <div class="u-details">
              <div class="u-row"><span>Capacidade:</span> <strong>${u.capacidade} MW</strong></div>
              <div class="u-row"><span>Município:</span> <strong>${u.municipio}</strong></div>
              <div class="u-row"><span>Início de Operação:</span> <strong>${dataStr}</strong></div>
            </div>
            
            <div class="u-stats">
              
                <div class="u-stat-row">
                  <span>Risco Atual:</span>
                  <strong style="color:${color}" title="${u.fatorRisco || 'Sem dados'}"><span class="status-dot" style="background:${color}"></span> ${u.risco}</strong>
                </div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: -6px; margin-bottom: 8px; font-style: italic;">
                  ${u.fatorRisco || ''}
                </div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; justify-content: space-between;">
                  <span>Fonte: ${u.fonteClima === 'CACHE_ANTIGO' || u.fonteClima === 'SEM_DADOS' ? '<strong style="color:var(--warn)">' + u.fonteClima + '</strong>' : u.fonteClima || 'Open-Meteo'}</span>
                </div>

              <div class="u-stat-row">
                <span>Janela O&M:</span>
                ${omHtml}
              </div>
              <div class="u-stat-row">
                <span>Energia Cortada:</span>
                <strong class="val-crit">${((u.energiaCortada || 0)/1000).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})} GWh</strong>
              </div>
              <div class="u-stat-row">
                <span>Receita Perdida:</span>
                <strong style="color:var(--high)">${perdaText}</strong>
              </div>
            </div>
          </div>
        `;
    });
  }

  function filtrarPaginar() {
      const search = document.getElementById('search-usina').value.toLowerCase();
      const filtradas = todasUsinas.filter(u => u.nome.toLowerCase().includes(search) || (u.operador && u.operador.toLowerCase().includes(search)));
      
      const totalPaginas = Math.ceil(filtradas.length / ITENS_POR_PAGINA) || 1;
      if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
      
      const start = (paginaAtual - 1) * ITENS_POR_PAGINA;
      const end = start + ITENS_POR_PAGINA;
      const paginadas = filtradas.slice(start, end);
      
      renderGrid(paginadas);
      
      document.getElementById('page-info').textContent = `Página ${paginaAtual} de ${totalPaginas} (${filtradas.length} resultados)`;
      document.getElementById('btn-prev').disabled = paginaAtual === 1;
      document.getElementById('btn-next').disabled = paginaAtual === totalPaginas;
      
      document.getElementById('btn-prev').style.opacity = paginaAtual === 1 ? '0.5' : '1';
      document.getElementById('btn-next').style.opacity = paginaAtual === totalPaginas ? '0.5' : '1';
  }

  function mudarPagina(dir) {
      paginaAtual += dir;
      filtrarPaginar();
      window.scrollTo(0,0);
  }

  async function init() {
    const ano = document.getElementById('ano-selector').value || 2026;
    const grid = document.getElementById('usinas-grid');
    grid.innerHTML = '<p>Carregando dados das usinas...</p>';
    
    const data = await fetchWithAuth(`/api/dashboard/resumo-geral?ano=${ano}`);
    if (data && data.usinas) {
      todasUsinas = data.usinas;
      paginaAtual = 1;
      filtrarPaginar();
    }
  }

  init();
</script>
</body>
</html>
